<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="stylesheet" href="style.css" />
    <script src="sasjs.js"></script>
    <script src="scripts.js"></script>
  </head>

  <body>
    <!--
      ## SASJS Adapter config details ##

      * appLoc: The location in metadata or SAS drive where App/services will be deployed
      * serverType: either SAS9, SASVIYA or SASJS
      * serverUrl: Url of the server where services are deployed. Can leave blank if frontend and backend is running on same server
      * loginMechanism: Use 'Default' for regular (user/pass) logins, or 'Redirected' for 2FA/SSO
      * debug: Whether to enable debug on startup

      ## Viya only settings ##
      * useComputeApi: either true or false
      * contextName: Compute Context

    -->
    <sasjs
      appLoc="/Public/app/minimal-seed-app"
      serverType="SASJS"
      serverUrl=""
      loginMechanism="Redirected"
      debug="false"
      useComputeApi="true"
      contextName="SAS Job Execution compute context"
    ></sasjs>

    <main>
      <h1>Hello!</h1>
      <p class="subtitle">
        Welcome to the Vanilla JS Seed App for
        <span class="code">SASjs</span>
      </p>

      <!-- Nothing below is shown until checkSession() has answered. The form is
           hidden by the ATTRIBUTE, which applies before style.css has loaded,
           and the script reveals it only when there is no session. -->
      <form id="login-form" hidden>
        <input
          type="text"
          id="username"
          placeholder="Username"
          aria-label="Username"
          autocomplete="username"
        />
        <input
          type="password"
          id="password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
        />
        <button type="submit">Log in</button>
        <p id="login-error" role="alert" hidden>
          Log in failed - check your username and password.
        </p>
      </form>

      <div id="data-container" hidden>
        <button id="load-startup-data">Load Startup Data</button>
        <div id="results"></div>
      </div>

      <div id="logout-container" hidden>
        <button id="logout">Log out</button>
      </div>

    </main>

    <a
      class="source"
      href="https://github.com/sasjs/minimal-seed-app"
      title="Source on GitHub"
      aria-label="Source on GitHub"
    >
      <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
        <path
          fill="currentColor"
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.15-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
  </body>
</html>
