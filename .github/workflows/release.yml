name: Push SASjs Server Deploy Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Use the MIT-licensed CLI directly; gitleaks-action requires an
      # organization license. Pin and verify the release archive before use.
      - name: Scan full reachable history
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 .

  release:
    needs: secret-scan
    runs-on: ubuntu-latest
    # the release makes a tag and a release: nothing is committed back, so write on
    # contents is the whole of what the token needs
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # the tags are the version history: the release works out the next version
          # from the last one, and a depth-1 clone has none
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci, and the CLI comes from devDependencies: a build that used
      # whatever `npm i -g @sasjs/cli` resolved could differ from the version
      # this repo pins and tested.
      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      # the page ships the committed adapter bundle, so a copy that has fallen
      # behind the pinned adapter is caught here rather than in a browser
      - name: Check the adapter bundle is current
        run: npm run check:bundle

      # what the app ships must have no advisories at all
      - name: Audit the dependencies that ship
        run: npm audit --omit=dev

      # and nothing high or critical anywhere, nor any advisory outside the
      # npm-bundled set this repository cannot patch - see scripts/audit-gate.js
      - name: Audit the dev toolchain
        run: npm run audit:gate

      # the guards' own tests: the table parser's shapes, and the audit gate
      # biting on the reports it exists for
      - name: Unit tests
        run: npm run test:unit

      # the JS services answer from springs.json, generated deterministically
      # by scripts/springs-data.js - fail here if the committed file has drifted
      - name: Check the mock dataset is reproducible
        run: npm run check:data

      # the mocked build is a static site whose backend runs in the browser.
      # Building it on every run means a change to the services or the mock
      # target that breaks that build fails here, not at the next person who
      # tries to demo the app.
      - name: Build the mocked site
        run: |
          npm run mock:build
          test -s sasjsbuild/mock/index.html
          test -s sasjsbuild/mock/host/vfs-seed.json

      # and prove it answers: the worker is booted from the build output and the
      # two services the page calls are exercised
      - name: Check the mocked site answers
        run: npm run test:mock

      - name: Upload the mocked site
        uses: actions/upload-artifact@v4
        with:
          name: minimal-seed-app-mock
          path: sasjsbuild/mock/
          if-no-files-found: error

      # Each target builds into its own folder under sasjsbuild - the same shape the
      # mock target already uses - because `sasjs cb` clears the folder it writes
      # before it writes, so three builds into one would leave only the last. What a
      # release publishes is the `release` block in sasjs/sasjsconfig.json, which is
      # why nothing is copied or renamed here.
      - name: Build the SAS 9 EBI deployment program
        run: npx sasjs cb -t sas9

      - name: Build the Viya deployment program
        run: npx sasjs cb -t viya

      - name: Build the SASjs deploy package
        run: npx sasjs cb -t server

      # @sasjs/release is a devDependency, so the version that runs is the one in
      # package-lock.json rather than whatever the registry served today. It reads
      # the conventional commits since the last tag, makes the tag and the release,
      # and attaches the files the config names - which were built above, in this
      # job, so they exist at the moment the release is cut.
      #
      # The token is the workflow's own, not a stored PAT: a secret that has to be
      # rotated by hand is a release that stops working silently when nobody does.
      #
      # What this gives up: a release created with the workflow token does not
      # itself trigger other workflows. Nothing here depends on that - the site is
      # published from the merge push, not from the release event.
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx sasjs-release --release
