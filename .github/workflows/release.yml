name: Push SASjs Server Deploy Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci, and the CLI comes from devDependencies: a build that used
      # whatever `npm i -g @sasjs/cli` resolved could differ from the version
      # this repo pins and tested.
      - name: Install dependencies
        run: npm ci
        env:
          CI: true

      # the page ships the committed adapter bundle, so a copy that has fallen
      # behind the pinned adapter is caught here rather than in a browser
      - name: Check the adapter bundle is current
        run: npm run check:bundle

      # what the app ships must have no advisories at all
      - name: Audit the dependencies that ship
        run: npm audit --omit=dev

      # and the dev toolchain must have nothing high or critical. The moderates
      # that remain are inside the npm 11 that @semantic-release/npm bundles -
      # they cannot be overridden from here, and they run only on this runner
      # during a release.
      - name: Audit for high or critical advisories
        run: npm audit --audit-level=high

      # the JS services answer from springs.json, which is generated from the
      # datalines in sasjs/utils/serviceinit.sas - fail here if they have drifted
      - name: Check the mock dataset is in step with the SAS one
        run: npm run check:data

      # the mocked build is a static site whose backend runs in the browser.
      # Building it on every run means a change to the services or the mock
      # target that breaks that build fails here, not at the next person who
      # tries to demo the app.
      - name: Build the mocked site
        run: |
          npm run mock:build
          test -s sasjsbuild/mock/index.html
          test -s sasjsbuild/mock/host/vfs-seed.json

      # and prove it answers: the worker is booted from the build output and the
      # two services the page calls are exercised
      - name: Check the mocked site answers
        run: npm run test:mock

      - name: Upload the mocked site
        uses: actions/upload-artifact@v4
        with:
          name: minimal-seed-app-mock
          path: sasjsbuild/mock/
          if-no-files-found: error

      - name: create SAS 9 EBI build and Add to Release
        run: |
          npx sasjs cb -t sas9
          mkdir -p ./artefacts
          cp ./sasjsbuild/mysas9deploy.sas ./artefacts/sas9.sas

      - name: create Viya build and Add to Release
        run: |
          npx sasjs cb -t viya
          cp ./sasjsbuild/myviyadeploy.sas ./artefacts/viya.sas

      - name: create SASjs build and Add to Release
        run: |
          npx sasjs cb -t server
          cp ./sasjsbuild/server.json.zip ./artefacts/server.json.zip

      # semantic-release is a devDependency, so the version that runs is the one
      # in package-lock.json rather than whatever the registry served today
      - name: Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
